name: Workforce Suite checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  public-source:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: git diff --check
      - run: node --test tests/public_source.test.mjs tests/release_version.test.mjs
      - run: node tools/public-source-check.mjs --history

  employee-service:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test the shared own-record service
        run: cargo test --manifest-path employee-portal/Cargo.toml --locked --lib --features android-ui,android-push
      - name: Test the Android Rust bridge lifecycle
        run: cargo test --manifest-path employee-android/rust/Cargo.toml --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test bundled employee interface
        run: node --test employee-portal/tests/*.test.mjs

  desktop:
    if: github.event.repository.private == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test native workflows and transport
        run: cargo test --workspace --locked
      - name: Build generic native applications
        run: cargo build --workspace --release --locked

  database:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned local PostgreSQL test engine
        working-directory: tools/db-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test schema replay and permission boundaries
        working-directory: tools/db-tests
        run: npm test
      - name: Test privileged functions and release validation
        run: node --test tests/account_admin_edge.test.mjs tests/staff_provision_edge.test.mjs tests/desktop_release_edge.test.mjs

# Standard public runners only. Private events skip every job without a runner.
# No artifact/cache upload, deployment, provider connection or signing credentials.
