[package]
name = "hris-desktop"
version = "0.1.56"
edition = "2024"
rust-version = "1.95"
description = "Native Rust HRIS prototype with a Supabase data adapter"
publish = false

[package.metadata.application]
id = "io.github.tatselkrik.hrisdesktop"

[features]
qa-screenshot = []

[dependencies]
anyhow = "=1.0.102"
chrono = { version = "=0.4.44", features = ["serde"] }
chrono-tz = "=0.10.4"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland", "clipboard"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
ed25519-dalek = "=3.0.0"
quick-xml = "=0.41.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
calamine = { version = "=0.37.0", default-features = false, features = ["chrono"] }
rust_xlsxwriter = { version = "=0.101.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
