[package]
name = "hris-employee-portal"
version = "0.1.8"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Separate employee self-service portal with a Rust server"

[package.metadata.application]
id = "io.github.tatselkrik.hrisportal"

[features]
default = ["desktop-tls"]
desktop-tls = ["reqwest/native-tls"]
android-tls = ["reqwest/rustls-no-provider", "dep:rustls", "dep:webpki-roots"]

[dependencies]
anyhow = "=1.0.102"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "=0.4.44", features = ["serde"] }
chrono-tz = "=0.10.4"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "query"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"

rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "=1.0.6", optional = true }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
