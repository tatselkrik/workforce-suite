[package]
name = "hris-employee-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
hris-employee-portal = { path = "../../employee-portal", default-features = false, features = ["android-tls", "android-push"] }
anyhow = "=1.0.102"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }
serde_json = "=1.0.149"
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
[profile.dev]
debug = 0
incremental = false
[profile.release]
lto = "thin"
strip = true
